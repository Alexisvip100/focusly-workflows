
services:
  db:
    image: postgres:15-alpine
    container_name: focusly-postgres
    restart: always
    environment:
      POSTGRES_DB: focusly
      POSTGRES_USER: focusly_user
      POSTGRES_PASSWORD: focusly_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: focusly-redis
    restart: always
    ports:
      - '6379:6379'

  web:
    build: .
    container_name: focusly-web
    restart: always
    ports:
      - '8000:3000'
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://focusly_user:focusly_password@db:5432/focusly
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - minio
    networks:
      - default
      - focusly-net
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Consola web (admin)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MinIO handles CORS server-wide via this env var, not per-bucket — the
      # standard S3 PutBucketCors API (and mc's own `mc cors set`) both
      # return "NotImplemented" on current MinIO releases.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:3000,https://focusly-front-psi.vercel.app"
    volumes:
      - minio_data:/data
    networks:
      - default
      - focusly-net

volumes:
  pgdata:
    driver: local
  minio_data:


networks:
  focusly-net:
    external: true
